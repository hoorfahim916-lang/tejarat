<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bgGrad1)"/>
  <rect x="20" y="20" width="460" height="460" rx="85" fill="none" stroke="url(#goldGrad1)" stroke-width="3" opacity="0.6"/>
  <!-- Shield Badge -->
  <path d="M 250 80 L 380 140 L 380 270 Q 380 370 250 420 Q 120 370 120 270 L 120 140 Z" fill="#047857" stroke="url(#goldGrad1)" stroke-width="6" filter="url(#glow1)"/>
  <!-- Inner Stylized T -->
  <path d="M 180 170 H 320 V 215 H 275 V 360 H 225 V 215 H 180 Z" fill="url(#goldGrad1)"/>
  <!-- Crown Accent -->
  <circle cx="250" cy="140" r="10" fill="#FDE047"/>
  <circle cx="210" cy="148" r="7" fill="#FDE047"/>
  <circle cx="290" cy="148" r="7" fill="#FDE047"/>
  <text x="250" y="455" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#FDE047" text-anchor="middle" letter-spacing="4">TEJARAT</text>
  <text x="250" y="480" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#A7F3D0" text-anchor="middle" letter-spacing="2">PAKISTAN RESELLER</text>
</svg>