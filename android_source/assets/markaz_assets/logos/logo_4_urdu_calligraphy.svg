<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg4)"/>
  <!-- Circular Golden Wreath -->
  <circle cx="250" cy="230" r="150" fill="none" stroke="url(#gold4)" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="250" cy="230" r="165" fill="none" stroke="url(#gold4)" stroke-width="1.5" opacity="0.6"/>
  <text x="250" y="260" font-family="'Traditional Arabic', Arial, sans-serif" font-weight="900" font-size="95" fill="url(#gold4)" text-anchor="middle">تجارت</text>
  <!-- English Banner -->
  <rect x="110" y="370" width="280" height="50" rx="25" fill="#047857" stroke="url(#gold4)" stroke-width="2"/>
  <text x="250" y="403" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">TEJARAT APP</text>
</svg>