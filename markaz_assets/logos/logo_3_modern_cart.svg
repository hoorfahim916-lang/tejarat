<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg3)"/>
  <!-- Modern Bag -->
  <g transform="translate(100, 70)">
    <!-- Bag Handle -->
    <path d="M 90 100 A 60 60 0 0 1 210 100" fill="none" stroke="url(#gold3)" stroke-width="16" stroke-linecap="round"/>
    <!-- Bag Body -->
    <rect x="40" y="100" width="220" height="240" rx="35" fill="url(#bagGrad)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.3))"/>
    <!-- Elegant Gold Leaf / Wing -->
    <path d="M 150 140 C 200 180 200 240 150 280 C 130 260 130 200 150 140 Z" fill="url(#gold3)"/>
    <path d="M 150 170 C 180 200 180 250 150 280" fill="none" stroke="#047857" stroke-width="4"/>
  </g>
  <text x="250" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TEJARAT</text>
  <text x="250" y="450" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#FDE047" text-anchor="middle" letter-spacing="4">RESELLER & SHOP</text>
</svg>